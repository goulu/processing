<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Body Gravitational Simulation - p5.js</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  </head>
  <body>
    <div class="controls-overlay">
      <div class="title-bar">
        <h1>N-Body Simulation</h1>
        <a href="/" class="back-link">← Hub</a>
      </div>
      <p class="author-note">Dr. Goulu • Système Solaire (system.xml)</p>

      <div class="control-grid">
        <label>
          <span>Vitesse de simulation (<span id="speed-val">1x</span>)</span>
          <input type="range" id="speed-slider" min="0.1" max="20" step="0.5" value="2" />
        </label>
        <label>
          <span>Centrer la vue sur</span>
          <select id="focus-select">
            <option value="sun">Soleil (Système entier)</option>
            <option value="inner">Planètes telluriques (Zoom)</option>
            <option value="earth">Système Terre - Lune</option>
            <option value="jupiter">Jupiter et lunes galiléennes</option>
            <option value="saturn">Saturne et lunes</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="show-trails" checked />
          <span>Tracer les orbites (traînées)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="show-labels" checked />
          <span>Afficher les noms des corps</span>
        </label>
      </div>

      <div class="button-group">
        <button id="pause-btn" class="action-btn">⏸ Pause</button>
        <button id="reset-btn">🔄 Réinitialiser</button>
      </div>

      <div class="hint-keys">
        <span>Navigation : <b>Molette</b> Zoom • <b>Glisser</b> Déplacer</span>
      </div>
    </div>

    <div id="info-hud" class="info-hud">
      <div id="body-count">Chargement des corps célestes...</div>
      <div id="sim-time">Temps simulé : 0 jours</div>
    </div>

    <main id="sketch-container"></main>
    <script src="sketch.js"></script>
  </body>
</html>
