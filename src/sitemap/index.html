<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitemap Graph Visualization - p5.js</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  </head>
  <body>
    <div class="controls-overlay">
      <div class="title-bar">
        <h1>Sitemap Network</h1>
        <a href="/" class="back-link">← Hub</a>
      </div>
      <p class="author-note">Marcel Salathé & Philippe Guglielmetti</p>

      <div class="control-grid">
        <label>
          <span>Exemple de site</span>
          <select id="preset-select">
            <option value="drgoulu">drgoulu.com (Blog & Catégories)</option>
            <option value="processing">processing.org & p5js.org</option>
            <option value="complex">Graphe complexe multi-domaines</option>
            <option value="tree">Structure arborescente profonde</option>
          </select>
        </label>
        <label>
          <span>Répulsion entre nœuds</span>
          <input type="range" id="repulsion-slider" min="500" max="8000" step="250" value="2500" />
        </label>
        <label>
          <span>Longueur des liens</span>
          <input type="range" id="length-slider" min="20" max="120" step="5" value="45" />
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="auto-zoom" checked />
          <span>Centrage et zoom automatique</span>
        </label>
      </div>

      <div class="button-group">
        <button id="add-node-btn" class="action-btn">➕ Ajouter nœud</button>
        <button id="pause-btn">⏸ Pause</button>
        <button id="reset-btn">🔄 Réinitialiser</button>
      </div>

      <div class="hint-keys">
        <span>Interaction : <b>Clic & Glisser</b> Déplacer un nœud • <b>Clic dans le vide</b> Créer un nœud</span>
      </div>
    </div>

    <div id="hover-card" class="hover-card"></div>

    <main id="sketch-container"></main>
    <script src="sketch.js"></script>
  </body>
</html>
