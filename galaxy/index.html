<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spiral Galaxy Simulation - p5.js</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  </head>
  <body>
    <div class="controls-overlay">
      <div class="title-bar">
        <h1>Galaxy Simulation</h1>
        <a href="/" class="back-link">← Hub</a>
      </div>
      <p class="author-note">Dr. Goulu (2008) • Portage p5.js</p>

      <div class="control-grid">
        <label>
          <span>Étoiles (<span id="stars-val">2500</span>)</span>
          <input type="range" id="stars-slider" min="500" max="8000" step="250" value="2500" />
        </label>
        <label>
          <span>Torsion (Twist)</span>
          <input type="range" id="twist-slider" min="0" max="0.08" step="0.001" value="0.035" />
        </label>
        <label>
          <span>Ratio Ellipse</span>
          <input type="range" id="ratio-slider" min="0.4" max="1.0" step="0.01" value="0.85" />
        </label>
        <label>
          <span>Vitesse</span>
          <input type="range" id="speed-slider" min="0" max="0.05" step="0.002" value="0.015" />
        </label>
        <label>
          <span>Couleur</span>
          <select id="color-select">
            <option value="warm">Or / Blanc chaud (Original)</option>
            <option value="cyan">Bleu Cosmique</option>
            <option value="plasma">Plasma Violet</option>
            <option value="core-gradient">Gradient Cœur-Bras</option>
          </select>
        </label>
      </div>

      <div class="button-group">
        <button id="pause-btn" class="action-btn">⏸ Pause</button>
        <button id="trails-btn">✨ Traînées : ON</button>
        <button id="reset-btn">🔄 Réinitialiser</button>
      </div>
      <div class="hint-keys">
        <span>Touches : <b>↑ / ↓</b> Ellipse • <b>← / →</b> Twist • <b>Espace</b> Pause</span>
      </div>
    </div>
    <main id="sketch-container"></main>
    <script src="sketch.js"></script>
  </body>
</html>
